<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <article>
        <h2>linear</h2>
        <div class="box">
            <div class="dot linear"></div>
        </div>
    </article>
    <article>
        <h2>ease</h2>
        <div class="box">
            <div class="dot"></div>
        </div>
    </article>
    <article>
        <h2>ease-in</h2>
        <div class="box">
            <div class="dot ease-in"></div>
        </div>
    </article>
    <article>
        <h2>ease-out</h2>
        <div class="box">
            <div class="dot ease-out"></div>
        </div>
    </article>
    <article>
        <h2>ease-in-out</h2>
        <div class="box">
            <div class="dot ease-in-out"></div>
        </div>
    </article>
    <article>
        <h2>cubic-bezier(0.950, 0.050, 0.795, 0.035)</h2>
        <div class="box">
            <div class="dot ease-in-expo"></div>
        </div>
    </article>
    <article>
        <h2>cubic-bezier(0.190, 1.000, 0.220, 1.000);</h2>
        <div class="box">
            <div class="dot ease-out-expo"></div>
        </div>
    </article>
    <article>
        <h2>cubic-bezier(0.34, 1.56, 0.64, 1)</h2>
        <div class="box">
            <div class="dot ease-out-back"></div>
        </div>
    </article>
    <article>
        <h2>cubic-bezier(0.8, -0.4, 0.5, 1)</h2>
        <div class="box">
            <div class="dot ease-in-back"></div>
        </div>
    </article>
    <article>
        <h2>linear(...)</h2>
        <div class="box">
            <div class="dot spring"></div>
        </div>
    </article>
    <article>
        <h2>linear(...)</h2>
        <div class="box">
            <div class="dot bouncy"></div>
        </div>
    </article>
    <article>
        <h2>linear(...)</h2>
        <div class="box">
            <div class="dot overshoot"></div>
        </div>
    </article>
</body>

</html>
