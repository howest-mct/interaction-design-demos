<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Popover</title>
</head>

<body>

    <button type="button" class="toggle-popover" popovertarget="myPopover">Toggle Popover</button>
    <div class="popover" id="myPopover" popover>
        <p>This is a popover!</p>
    </div>

</body>

</html>
