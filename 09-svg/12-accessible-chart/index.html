<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accessible chart</title>
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <figure class="demo">
        <!-- role="img": one image in the accessibility tree, with a name and a description -->
        <svg class="chart" viewBox="-12 -6 114 64" role="img" aria-labelledby="chart-title chart-desc">
            <title id="chart-title">Visitors per day</title>
            <!-- What should you remember from this chart? Not every value -->
            <desc id="chart-desc">Thursday is the busiest day with 9,000 visitors, Wednesday the quietest with 3,000.</desc>

            <g class="chart__grid">
                <line x1="0" y1="0" x2="100" y2="0" />
                <line x1="0" y1="25" x2="100" y2="25" />
                <line x1="0" y1="50" x2="100" y2="50" />
            </g>

            <g class="chart__bars">
                <rect x="3" y="30" width="14" height="20" />
                <rect x="23" y="15" width="14" height="35" />
                <rect x="43" y="35" width="14" height="15" />
                <rect x="63" y="5" width="14" height="45" />
                <rect x="83" y="20" width="14" height="30" />
            </g>

            <g class="chart__labels chart__labels--y">
                <text x="-2" y="0">10k</text>
                <text x="-2" y="25">5k</text>
                <text x="-2" y="50">0</text>
            </g>

            <!-- The value on top of each bar: the information is not only in the height -->
            <g class="chart__labels chart__labels--value">
                <text x="10" y="28.5">4k</text>
                <text x="30" y="13.5">7k</text>
                <text x="50" y="33.5">3k</text>
                <text x="70" y="3.5">9k</text>
                <text x="90" y="18.5">6k</text>
            </g>

            <g class="chart__labels chart__labels--x">
                <text x="10" y="55">Mon</text>
                <text x="30" y="55">Tue</text>
                <text x="50" y="55">Wed</text>
                <text x="70" y="55">Thu</text>
                <text x="90" y="55">Fri</text>
            </g>
        </svg>

        <!-- The same data as a table: change one, change the other too -->
        <details class="data">
            <summary>Show the data</summary>
            <table class="data__table">
                <caption>Visitors per day</caption>
                <thead>
                    <tr>
                        <th scope="col">Day</th>
                        <th scope="col">Visitors</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <th scope="row">Monday</th>
                        <td>4,000</td>
                    </tr>
                    <tr>
                        <th scope="row">Tuesday</th>
                        <td>7,000</td>
                    </tr>
                    <tr>
                        <th scope="row">Wednesday</th>
                        <td>3,000</td>
                    </tr>
                    <tr>
                        <th scope="row">Thursday</th>
                        <td>9,000</td>
                    </tr>
                    <tr>
                        <th scope="row">Friday</th>
                        <td>6,000</td>
                    </tr>
                </tbody>
            </table>
        </details>
    </figure>
</body>

</html>
