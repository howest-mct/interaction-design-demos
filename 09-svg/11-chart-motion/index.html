<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chart motion</title>
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <main class="demo">
        <p class="demo__hint">Reload the page to replay the animations.</p>

        <figure class="example">
            <svg class="chart chart--bars" viewBox="0 0 100 50" aria-hidden="true">
                <!-- --i is the index of the bar, for the stagger -->
                <rect class="chart__bar" style="--i: 0" x="3" y="30" width="14" height="20" />
                <rect class="chart__bar" style="--i: 1" x="23" y="15" width="14" height="35" />
                <rect class="chart__bar" style="--i: 2" x="43" y="35" width="14" height="15" />
                <rect class="chart__bar" style="--i: 3" x="63" y="5" width="14" height="45" />
                <rect class="chart__bar" style="--i: 4" x="83" y="20" width="14" height="30" />
            </svg>
            <figcaption>Bars grow from the bottom, one after the other. Hover a bar.</figcaption>
        </figure>

        <figure class="example">
            <svg class="chart" viewBox="0 0 100 50" aria-hidden="true">
                <!-- pathLength="1": the browser treats the line as 1 unit long, whatever its real length -->
                <polyline class="chart__line" pathLength="1" points="10,30 30,15 50,35 70,5 90,20" />
            </svg>
            <figcaption>The line draws itself with <code>stroke-dashoffset</code>.</figcaption>
        </figure>
    </main>
</body>

</html>
