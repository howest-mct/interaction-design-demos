<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Line chart</title>
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <main class="demo">
        <!--
            The same data as 04-bar-chart: 4, 7, 3, 9, 6, max = 10, viewBox = 100 × 50
            x: the middle of each bar (10, 30, 50, 70, 90)
            y: 50 - value / max * 50 (30, 15, 35, 5, 20)
        -->
        <svg class="chart" viewBox="0 0 100 50" aria-hidden="true">
            <!-- Area first, so the line is drawn on top: the same points plus the two bottom corners -->
            <polygon class="chart__area" points="10,50 10,30 30,15 50,35 70,5 90,20 90,50" />
            <polyline class="chart__line" points="10,30 30,15 50,35 70,5 90,20" />

            <!-- A <title> inside an SVG element gives a native tooltip -->
            <g class="chart__points">
                <circle cx="10" cy="30" r="1.5"><title>Mon: 4</title></circle>
                <circle cx="30" cy="15" r="1.5"><title>Tue: 7</title></circle>
                <circle cx="50" cy="35" r="1.5"><title>Wed: 3</title></circle>
                <circle cx="70" cy="5" r="1.5"><title>Thu: 9</title></circle>
                <circle cx="90" cy="20" r="1.5"><title>Fri: 6</title></circle>
            </g>
        </svg>
        <p class="demo__hint">Hover a point: a <code>&lt;title&gt;</code> inside an SVG element gives a native tooltip.</p>
    </main>
</body>

</html>
