<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bar chart with axes</title>
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <!--
        The chart itself is 100 × 50, like 04-bar-chart.
        The viewBox is larger: 12 extra units on the left and 8 below for the labels.
    -->
    <svg class="chart" viewBox="-12 -2 114 60" aria-hidden="true">
        <!-- Drawn in this order: grid first, so the bars are on top -->
        <g class="chart__grid">
            <line x1="0" y1="0" x2="100" y2="0" />
            <line x1="0" y1="25" x2="100" y2="25" />
            <line x1="0" y1="50" x2="100" y2="50" />
        </g>

        <g class="chart__bars">
            <rect x="3" y="30" width="14" height="20" />
            <rect x="23" y="15" width="14" height="35" />
            <rect x="43" y="35" width="14" height="15" />
            <rect x="63" y="5" width="14" height="45" />
            <rect x="83" y="20" width="14" height="30" />
        </g>

        <!-- y-axis: aligned to the right, just left of 0 -->
        <g class="chart__labels chart__labels--y">
            <text x="-2" y="0">10</text>
            <text x="-2" y="25">5</text>
            <text x="-2" y="50">0</text>
        </g>

        <!-- x-axis: centered under each bar (x + 7) -->
        <g class="chart__labels chart__labels--x">
            <text x="10" y="55">Mon</text>
            <text x="30" y="55">Tue</text>
            <text x="50" y="55">Wed</text>
            <text x="70" y="55">Thu</text>
            <text x="90" y="55">Fri</text>
        </g>
    </svg>
</body>

</html>
