<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sparkline</title>
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <main class="demo">
        <!-- The trend is decorative: the text next to it holds the information -->
        <div class="stat">
            <p class="stat__label">Visitors this week</p>
            <p class="stat__value">
                9,024
                <svg class="sparkline" viewBox="0 0 100 30" aria-hidden="true">
                    <polyline points="0,20 16,12 33,24 50,8 66,14 83,4 100,10" />
                </svg>
                <span class="stat__change stat__change--up">+12%</span>
            </p>
        </div>

        <div class="stat">
            <p class="stat__label">Average time on page</p>
            <p class="stat__value">
                1m 42s
                <svg class="sparkline sparkline--down" viewBox="0 0 100 30" aria-hidden="true">
                    <polyline points="0,6 16,10 33,8 50,16 66,14 83,22 100,24" />
                </svg>
                <span class="stat__change stat__change--down">−8%</span>
            </p>
        </div>

        <!-- Sized in em: the sparkline scales with the font-size of the text -->
        <p class="demo__text">
            In running text too: sign-ups
            <svg class="sparkline" viewBox="0 0 100 30" aria-hidden="true">
                <polyline points="0,24 16,20 33,22 50,14 66,16 83,8 100,4" />
            </svg>
            doubled this month.
        </p>
    </main>
</body>

</html>
