<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Same-document view transition demo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <main class="demo">
        <div class="demo__grid" id="grid">
            <article class="card card--one" style="view-transition-name: card-one">
                <h2 class="card__title" style="view-transition-name: label-one">
                    <button class="card__open" type="button">One</button>
                </h2>
                <button class="card__close" type="button" aria-label="Close" hidden>
                    <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 256 256">
                        <path fill="currentColor" d="M128,24A104,104,0,1,0,232,128,104.11,104.11,0,0,0,128,24Zm37.66,130.34a8,8,0,0,1-11.32,11.32L128,139.31l-26.34,26.35a8,8,0,0,1-11.32-11.32L116.69,128,90.34,101.66a8,8,0,0,1,11.32-11.32L128,116.69l26.34-26.35a8,8,0,0,1,11.32,11.32L139.31,128Z" />
                    </svg>
                </button>
            </article>
            <article class="card card--two" style="view-transition-name: card-two">
                <h2 class="card__title" style="view-transition-name: label-two">
                    <button class="card__open" type="button">Two</button>
                </h2>
                <button class="card__close" type="button" aria-label="Close" hidden>
                    <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 256 256">
                        <path fill="currentColor" d="M128,24A104,104,0,1,0,232,128,104.11,104.11,0,0,0,128,24Zm37.66,130.34a8,8,0,0,1-11.32,11.32L128,139.31l-26.34,26.35a8,8,0,0,1-11.32-11.32L116.69,128,90.34,101.66a8,8,0,0,1,11.32-11.32L128,116.69l26.34-26.35a8,8,0,0,1,11.32,11.32L139.31,128Z" />
                    </svg>
                </button>
            </article>
            <article class="card card--three" style="view-transition-name: card-three">
                <h2 class="card__title" style="view-transition-name: label-three">
                    <button class="card__open" type="button">Three</button>
                </h2>
                <button class="card__close" type="button" aria-label="Close" hidden>
                    <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 256 256">
                        <path fill="currentColor" d="M128,24A104,104,0,1,0,232,128,104.11,104.11,0,0,0,128,24Zm37.66,130.34a8,8,0,0,1-11.32,11.32L128,139.31l-26.34,26.35a8,8,0,0,1-11.32-11.32L116.69,128,90.34,101.66a8,8,0,0,1,11.32-11.32L128,116.69l26.34-26.35a8,8,0,0,1,11.32,11.32L139.31,128Z" />
                    </svg>
                </button>
            </article>
            <article class="card card--four" style="view-transition-name: card-four">
                <h2 class="card__title" style="view-transition-name: label-four">
                    <button class="card__open" type="button">Four</button>
                </h2>
                <button class="card__close" type="button" aria-label="Close" hidden>
                    <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 256 256">
                        <path fill="currentColor" d="M128,24A104,104,0,1,0,232,128,104.11,104.11,0,0,0,128,24Zm37.66,130.34a8,8,0,0,1-11.32,11.32L128,139.31l-26.34,26.35a8,8,0,0,1-11.32-11.32L116.69,128,90.34,101.66a8,8,0,0,1,11.32-11.32L128,116.69l26.34-26.35a8,8,0,0,1,11.32,11.32L139.31,128Z" />
                    </svg>
                </button>
            </article>
        </div>
    </main>
    <script src="js/script.js"></script>
</body>

</html>
