<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tooltip</title>
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/style.css">
    <script type="module" src="js/main.js"></script>
</head>

<body>
    <main class="demo">
        <p class="demo__hint">Hover a bar, or press Tab to move through the bars. Escape closes the tooltip.</p>

        <!-- The chart is one image for assistive tech, the data is in the table below.
             The bars are focusable for keyboard users, so they are not aria-hidden. -->
        <svg class="chart" id="chart" viewBox="-12 -14 114 74" aria-labelledby="chart-title chart-desc" role="group">
            <title id="chart-title">Visitors per day</title>
            <desc id="chart-desc">Thursday is the busiest day with 9,000 visitors. Focus a bar to read its value.</desc>

            <g class="chart__grid">
                <line x1="0" y1="0" x2="100" y2="0" />
                <line x1="0" y1="25" x2="100" y2="25" />
                <line x1="0" y1="50" x2="100" y2="50" />
            </g>

            <g class="chart__labels chart__labels--y">
                <text x="-2" y="0">10k</text>
                <text x="-2" y="25">5k</text>
                <text x="-2" y="50">0</text>
            </g>

            <!-- tabindex="0": reachable with Tab. data-* holds what the tooltip shows. -->
            <g class="chart__bars">
                <rect class="chart__bar" tabindex="0" data-label="Mon" data-value="4,000" x="3" y="30" width="11" height="20" />
                <rect class="chart__bar" tabindex="0" data-label="Tue" data-value="5,500" x="17" y="23" width="11" height="27" />
                <rect class="chart__bar" tabindex="0" data-label="Wed" data-value="6,000" x="31" y="20" width="11" height="30" />
                <rect class="chart__bar" tabindex="0" data-label="Thu" data-value="9,000" x="45" y="5" width="11" height="45" />
                <rect class="chart__bar" tabindex="0" data-label="Fri" data-value="7,000" x="59" y="15" width="11" height="35" />
                <rect class="chart__bar" tabindex="0" data-label="Sat" data-value="3,000" x="73" y="35" width="11" height="15" />
                <rect class="chart__bar" tabindex="0" data-label="Sun" data-value="2,500" x="87" y="37.5" width="11" height="12.5" />
            </g>

            <g class="chart__labels chart__labels--x">
                <text x="8.5" y="55">Mon</text>
                <text x="22.5" y="55">Tue</text>
                <text x="36.5" y="55">Wed</text>
                <text x="50.5" y="55">Thu</text>
                <text x="64.5" y="55">Fri</text>
                <text x="78.5" y="55">Sat</text>
                <text x="92.5" y="55">Sun</text>
            </g>

            <!-- One tooltip that moves to the bar you point at. aria-hidden: the bar itself is the source. -->
            <g class="tooltip" id="tooltip" hidden aria-hidden="true">
                <rect class="tooltip__box" width="26" height="9" rx="1.5" />
                <text class="tooltip__text" x="13" y="4.5"></text>
            </g>
        </svg>
    </main>
</body>

</html>
