<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scatter plot with trend line</title>
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/style.css">
    <script type="module" src="js/main.js"></script>
</head>

<body>
    <main class="demo">
        <svg class="chart" id="chart" viewBox="-14 -4 118 76" role="img" aria-labelledby="chart-title chart-desc">
            <title id="chart-title">Hours studied versus score</title>
            <desc id="chart-desc"></desc>
        </svg>

        <p class="demo__result" id="result" aria-live="polite"></p>

        <div class="demo__buttons">
            <button type="button" data-kind="positive">Positive</button>
            <button type="button" data-kind="negative">Negative</button>
            <button type="button" data-kind="none">None</button>
            <button type="button" data-kind="curve">Curve</button>
        </div>

        <p class="demo__hint">The button generates new data. The number r is the correlation: close to 1 or -1 is a strong relationship, close to 0 is none. On a curve r stays low, while there clearly is a pattern: always look at the points first.</p>
    </main>
</body>

</html>
