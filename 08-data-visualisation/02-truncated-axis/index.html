<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Truncated axis</title>
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/style.css">
    <script type="module" src="js/main.js"></script>
</head>

<body>
    <main class="demo">
        <div class="demo__control">
            <label for="start">The y-axis starts at <output id="output" for="start">0</output></label>
            <input type="range" id="start" min="0" max="95" step="5" value="0">
        </div>

        <svg class="chart" id="chart" viewBox="-12 -4 114 64" role="img" aria-labelledby="chart-title chart-desc">
            <title id="chart-title">Score of three options</title>
            <desc id="chart-desc">A scores 96, B 97 and C 98. With the axis starting at 0 the difference is small.</desc>
        </svg>

        <p class="demo__hint">The values never change: 96, 97 and 98. Only the start of the axis does. With bars the length is the value, so the axis has to start at zero.</p>
    </main>
</body>

</html>
