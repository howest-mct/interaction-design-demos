<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive chart</title>
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <main class="demo">
        <p class="demo__hint">Drag the bottom right corner of the box to make it narrower or wider. Below 30rem the chart turns into horizontal bars.</p>

        <!-- The box is the container: the chart reacts to the size of the box, not of the window -->
        <div class="frame">
            <!-- Wide: vertical bars, labels under the bars -->
            <svg class="chart chart--wide" viewBox="-12 -4 124 66" role="img" aria-labelledby="wide-title wide-desc">
                <title id="wide-title">Visitors per city</title>
                <desc id="wide-desc">Antwerp is the busiest with 10,000 visitors, Ostend the quietest with 2,000.</desc>

                <g class="chart__grid">
                    <line x1="0" y1="0" x2="110" y2="0" />
                    <line x1="0" y1="25" x2="110" y2="25" />
                    <line x1="0" y1="50" x2="110" y2="50" />
                </g>
                <g class="chart__labels chart__labels--y">
                    <text x="-2" y="0">10k</text>
                    <text x="-2" y="25">5k</text>
                    <text x="-2" y="50">0</text>
                </g>
                <g class="chart__bars">
                    <rect x="2" y="0" width="9" height="50" />
                    <rect x="16" y="5" width="9" height="45" />
                    <rect x="30" y="20" width="9" height="30" />
                    <rect x="44" y="25" width="9" height="25" />
                    <rect x="58" y="25" width="9" height="25" />
                    <rect x="72" y="30" width="9" height="20" />
                    <rect x="86" y="35" width="9" height="15" />
                    <rect x="100" y="40" width="9" height="10" />
                </g>
                <g class="chart__labels chart__labels--x">
                    <text x="6.5" y="55">Antw</text>
                    <text x="20.5" y="55">Gent</text>
                    <text x="34.5" y="55">Brug</text>
                    <text x="48.5" y="55">Kort</text>
                    <text x="62.5" y="55">Hass</text>
                    <text x="76.5" y="55">Leuv</text>
                    <text x="90.5" y="55">Mech</text>
                    <text x="104.5" y="55">Oost</text>
                </g>
            </svg>

            <!-- Narrow: horizontal bars, full names left of the bars, sorted -->
            <svg class="chart chart--narrow" viewBox="0 0 100 80" role="img" aria-labelledby="narrow-title narrow-desc">
                <title id="narrow-title">Visitors per city</title>
                <desc id="narrow-desc">Antwerp is the busiest with 10,000 visitors, Ostend the quietest with 2,000.</desc>

                <g class="chart__labels chart__labels--left">
                    <text x="28" y="5">Antwerp</text>
                    <text x="28" y="15">Ghent</text>
                    <text x="28" y="25">Bruges</text>
                    <text x="28" y="35">Kortrijk</text>
                    <text x="28" y="45">Hasselt</text>
                    <text x="28" y="55">Leuven</text>
                    <text x="28" y="65">Mechelen</text>
                    <text x="28" y="75">Ostend</text>
                </g>
                <g class="chart__bars">
                    <rect x="30" y="1" width="68" height="8" />
                    <rect x="30" y="11" width="61" height="8" />
                    <rect x="30" y="21" width="41" height="8" />
                    <rect x="30" y="31" width="34" height="8" />
                    <rect x="30" y="41" width="34" height="8" />
                    <rect x="30" y="51" width="27" height="8" />
                    <rect x="30" y="61" width="20" height="8" />
                    <rect x="30" y="71" width="14" height="8" />
                </g>
            </svg>
        </div>
    </main>
</body>

</html>
